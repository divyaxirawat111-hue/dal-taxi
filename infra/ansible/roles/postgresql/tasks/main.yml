- name: Install PostgreSQL
  apt:
    name: postgresql
    state: present

- name: Make sure PostgreSQL is running and starts on boot
  service:
    name: postgresql
    state: started
    enabled: true

- name: Create the app's database user
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ vault_db_password }}"

- name: Create the app's database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
