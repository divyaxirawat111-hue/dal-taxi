- name: Create a system user that runs the app
  user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the app and log folders
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop:
    - /opt/dal-taxi
    - /var/log/dal-taxi

- name: Create the settings folder
  file:
    path: /etc/dal-taxi
    state: directory
    owner: root
    group: "{{ app_user }}"
    mode: "0750"

- name: Write the app settings file (contains the DB password)
  template:
    src: app.env.j2
    dest: /etc/dal-taxi/app.env
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  notify: Restart dal-taxi

- name: Install the systemd service
  template:
    src: dal-taxi.service.j2
    dest: /etc/systemd/system/dal-taxi.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart dal-taxi

- name: Enable the service so it starts on boot
  systemd:
    name: dal-taxi
    enabled: true
    daemon_reload: true

- name: Create the deploy user that Jenkins logs in as
  user:
    name: deploy
    shell: /bin/bash

- name: Allow Jenkins' key to log in as deploy
  ansible.posix.authorized_key:
    user: deploy
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/jenkins_deploy.pub') }}"

- name: Install the deploy script
  template:
    src: deploy.sh.j2
    dest: /opt/dal-taxi/deploy.sh
    owner: root
    group: root
    mode: "0755"

- name: Let deploy run ONLY the deploy script as root
  copy:
    dest: /etc/sudoers.d/deploy
    content: "deploy ALL=(root) NOPASSWD: /opt/dal-taxi/deploy.sh\n"
    mode: "0440"
    validate: "visudo -cf %s"
